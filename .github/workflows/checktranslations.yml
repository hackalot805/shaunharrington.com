name: Check For New Translations

run-name: ${{ github.actor }} is checking for new translations! 🚀
on: pull_request
permissions:
  contents: read # this is necessary for the Action to be able to read the contents of the repo
  pull-requests: write
jobs:
  changed_files:
    runs-on: ubuntu-latest
    name: Check Changed Files
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: GrantBirki/git-diff-action@v2.8.1
        id: git-diff-action
        with:
          json_diff_file_output: diff.json
          raw_diff_file_output: diff.txt
          file_output_only: "true"
      - name: Parse Changes
        id: parse-changes
        working-directory: ./dev
        run: |
          diffResult=$(node diffContainsTranslations.js)
          echo "diffResult = ${diffResult}"
          echo "HAS_CHANGES=${$diffResult}" >> $GITHUB_OUTPUT
      - name: Send Notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ steps.parse-changes.outputs.HAS_CHANGES }}" ]; then
            curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"body\":\"PR appears to have new or edited translations strings.\\nMake sure to run the translationStrings.js script and commit output to the monolith\"}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          fi
          
